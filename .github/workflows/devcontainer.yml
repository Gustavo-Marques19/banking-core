name: devcontainer

# Sobe o mesmo ambiente do Codespaces (compose com Postgres, Keycloak, RabbitMQ e Aspire, docker-in-docker)
# e roda os testes dentro dele. É a prova de que "Open in Codespaces" funciona sem instalar nada.
on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "infra/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -e
            dotnet build
            dotnet test --project tests/Banking.UnitTests
            dotnet test --project tests/Banking.ArchitectureTests
            dotnet test --project tests/Banking.IntegrationTests --filter-trait "Category=Concurrency"
